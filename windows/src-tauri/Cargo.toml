[package]
name = "viewtube-windows"
description = "ViewTube para Windows: a mesma interface do Mac (scripts de web/) numa casca Tauri."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "viewtube"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
viewtube-core = { path = "../../core" }
tauri = { version = "2", features = ["unstable", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
souvlaki = "0.8"
url = "2"
tokio = { version = "1", features = ["time"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_System_Com"] }

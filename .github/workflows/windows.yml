# Instalador do ViewTube para Windows (Tauri). Roda a cada push que mexe no núcleo, no app do
# Windows ou nos scripts compartilhados, e sob demanda (Actions → Windows → Run workflow).
# O instalador (.exe, NSIS) e o manifesto de atualização ficam nos artefatos da execução.
name: Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "core/**"
      - "windows/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Testes do núcleo e do app
        run: cargo test -p viewtube-core -p viewtube-windows

      - name: Instalador
        working-directory: windows
        # TAURI_SIGNING_PRIVATE_KEY (segredo do repositório) assina o pacote de atualização.
        # Sem ele o instalador é gerado do mesmo jeito; só não assina o feed de updates.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: ViewTube-Windows
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*.nsis.zip
            target/release/bundle/nsis/*.sig
          if-no-files-found: error
